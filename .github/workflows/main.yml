name: Build Windows App

on:
  workflow_dispatch: # Ti permette di cliccare un bottone su GitHub per avviare la build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=RELEASE_CHANNEL=Preview

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-Windows-Release
          path: build/windows/x64/runner/Release/
