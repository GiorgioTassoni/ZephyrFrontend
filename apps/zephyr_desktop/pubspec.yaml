name: zephyr_desktop
description: Zephyr music player - Desktop app shell (Linux, Windows).
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  ffi: ^2.1.2
  dbus: ^0.7.10
  zephyr_core:
    path: ../../packages/zephyr_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "References/Zephyr.png"
  windows:
    generate: true
    icon_size: 48
  linux:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - References/Zephyr_trasp.png
    - References/Zephyr.png
