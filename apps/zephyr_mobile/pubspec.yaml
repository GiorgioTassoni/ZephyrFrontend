name: zephyr_mobile
description: Zephyr music player - Android app shell.
publish_to: 'none'
version: 1.1.1+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  zephyr_core:
    path: ../../packages/zephyr_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "References/Zephyr.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - References/Zephyr_trasp.png
    - References/Zephyr.png
