name: zephyr_core
description: Shared core of the Zephyr music player - API client, models, providers, theme and widgets used by both the Android and Desktop apps.
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  audioplayers: ^6.8.1
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  file_picker: ^8.1.7
  path_provider: ^2.1.6
  intl: ^0.20.3
  google_fonts: ^6.2.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
